[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scnoisemeter"
version = "0.8.1"
description = "Barcode-aware alignment artifact and read-distribution QC for single-cell RNA-seq"
readme = "README.md"
# classifier.ReadResult uses @dataclass(slots=True), which is 3.10+.
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "scNoiseMeter contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pysam>=0.22",
    "pyranges>=0.0.129",
    "pandas>=2.0",
    "numpy>=1.24",
    "click>=8.1",
    "plotly>=5.18",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# ruff is pinned: CI treats a lint failure as a build failure, so an unpinned
# linter turns every upstream default-rule change into a red build on an
# untouched commit.
dev = ["pytest>=7", "pytest-cov", "black", "ruff>=0.16,<0.17"]

[project.scripts]
scnoisemeter = "scnoisemeter.cli:cli"

[project.urls]
Homepage = "https://github.com/FullLengthFanatic/scnoisemeter"
Issues = "https://github.com/FullLengthFanatic/scnoisemeter/issues"
Documentation = "https://github.com/FullLengthFanatic/scnoisemeter/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["scnoisemeter*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's default set (E4/E7/E9/F) plus import ordering.  Cosmetic modernisation
# rules (UP, C4, SIM) are deliberately not enabled here: they would rewrite most
# of the package in one commit and bury behavioural changes in the diff.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# report.py re-exports several figure helpers as `X as X`; without this the
# import sorter splits one readable block into four.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
